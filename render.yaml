services:
  - type: web
    name: amalsense
    env: node
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        value: sqlite.db
      - key: JWT_SECRET
        generateValue: true
      - key: PORT
        value: 10000
